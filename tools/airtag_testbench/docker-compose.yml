version: '3.8'

services:
  # Apple Anisette v3 Server (Tự động sinh header xác thực iCloud: X-Apple-I-MD, X-Apple-I-MD-M)
  anisette:
    image: dadoum/anisette-v3-server:latest
    container_name: anisette_v3_service
    restart: unless-stopped
    ports:
      - "6969:6969"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6969 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend Testbench (Xử lý P-224, Quản lý Key, Fetch Apple Report, GraphHopper API)
  findmy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findmy_backend_service
    restart: unless-stopped
    ports:
      - "8090:8000"
    environment:
      - ANISETTE_URL=http://anisette:6969
      - GRAPHHOPPER_URL=http://tymap_graphhopper:8989
    networks:
      - default
      - tymap_net
    volumes:
      - ./data:/app/data
      - ./backend_testbench.py:/app/backend_testbench.py
      - ./crypto_engine.py:/app/crypto_engine.py
    depends_on:
      - anisette

networks:
  tymap_net:
    external: true
